<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loup Garou Ultimate - Simulateur</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #243447; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1, h2 { margin-top: 0; }
    .warning, .panel { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .warning { background: #fff3cd; color: #664d03; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
    select, button { min-height: 42px; border: 1px solid #ccd5df; border-radius: 8px; padding: 0 14px; font: inherit; }
    button { cursor: pointer; border: 0; background: #2f80ed; color: #fff; font-weight: 700; }
    button.secondary { background: #64748b; }
    button.danger { background: #c0392b; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin-top: 12px; min-height: 22px; }
    .status.error { color: #b42318; }
    .player-list { display: grid; gap: 10px; }
    .player-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; border: 1px solid #e5e9ef; border-radius: 8px; padding: 12px; }
    .player-identity { display: flex; align-items: center; gap: 10px; }
    .player-identity span { display: flex; flex-direction: column; gap: 4px; }
    .player-identity small { color: #64748b; }
    .role-thumb { width: 42px; height: 42px; object-fit: contain; }
    .player-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 640px) { main { padding: 14px; } .controls, .player-row { align-items: stretch; flex-direction: column; } button, select { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>🧪 Simulateur de partie</h1>
    <div class="warning">
      Outil de développement uniquement. Il est disponible seulement avec <code>ENABLE_SIMULATOR=true</code> et reste séparé de la salle réelle.
    </div>

    <section class="panel">
      <h2>Créer une simulation</h2>
      <div class="controls">
        <label>
          Joueurs hors MJ
          <select id="player-count">
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
        </label>
        <button id="simulate-btn">🎲 Créer une simulation</button>
        <button id="reset-btn" class="danger">♻️ Réinitialiser</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section id="game-panel" class="panel" hidden>
      <h2>Simulation actuelle</h2>
      <p id="game-summary"></p>
      <div class="player-actions" style="margin-bottom: 14px;">
        <button id="mj-btn">👑 Vue MJ</button>
      </div>
      <h3>Vues joueurs</h3>
      <div id="player-list" class="player-list"></div>
    </section>
  </main>
  <script src="/js/simulator.js"></script>
</body>
</html>
