name: Deploy static V3 pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
            version: 10.28.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 24
            cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static website
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_MODE: 'true'
        run: |
          pnpm --filter @lgu/contracts build
          pnpm --filter @lgu/game-core build
          pnpm --filter @lgu/game-projection build
          pnpm --filter @lgu/web build
          cp apps/web/dist/index.html apps/web/dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
